<template>
    <template if:true={loaded}>
        <lightning-card title="EmailToLead AI Config" icon-name="utility:robot">
            <div class="page-container">
                <lightning-record-edit-form object-api-name="EmailToLead_Ai__AI_Configure__c" record-id={configId}
                    onsubmit={handleSubmit} onsuccess={handleSuccess} onerror={handleError}>

                    <lightning-messages></lightning-messages>

                    <!-- Model picklist -->
                    <div class="model-row">
                        <lightning-input-field field-name="EmailToLead_Ai__Model__c" value={modelValue}
                            onchange={handleModelChange}>
                        </lightning-input-field>
                    </div>

                    <!-- Prompts -->
                    <div class="prompt-grid">
                        <lightning-input-field field-name="EmailToLead_Ai__System_prompt__c" class="prompt-textarea"
                            value={systemPrompt} onchange={handleSystemPromptChange}>
                        </lightning-input-field>

                        <lightning-input-field field-name="EmailToLead_Ai__User_Prompt__c" class="prompt-textarea"
                            value={userPrompt} onchange={handleUserPromptChange}>
                        </lightning-input-field>
                    </div>

                    <!-- Actions -->
                    <div class="actions">
                        <lightning-button variant="brand" type="submit" label="Save"></lightning-button>
                        <lightning-button variant="neutral" label="Reset" onclick={handleReset}></lightning-button>
                    </div>

                </lightning-record-edit-form>
            </div>
        </lightning-card>
    </template>
</template>
